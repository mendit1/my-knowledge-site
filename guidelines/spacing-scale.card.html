<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale (8px grid)" subtitle="4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 44 · 48 · 56 · 64" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:20px 24px}
.row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.b{display:flex;flex-direction:column;align-items:center;gap:5px}
.bar{background:var(--accent-soft);border:1px solid var(--border-1);border-radius:var(--radius-sm)}
.v{font-family:ui-monospace,monospace;font-size:10px;color:var(--fg-2)}</style>
</head><body>
<div class="row">
<div class="b"><div class="bar" style="width:var(--space-1);height:var(--space-1)"></div><span class="v">4</span></div>
<div class="b"><div class="bar" style="width:var(--space-2);height:var(--space-2)"></div><span class="v">8</span></div>
<div class="b"><div class="bar" style="width:var(--space-3);height:var(--space-3)"></div><span class="v">12</span></div>
<div class="b"><div class="bar" style="width:var(--space-4);height:var(--space-4)"></div><span class="v">16</span></div>
<div class="b"><div class="bar" style="width:var(--space-5);height:var(--space-5)"></div><span class="v">20</span></div>
<div class="b"><div class="bar" style="width:var(--space-6);height:var(--space-6)"></div><span class="v">24</span></div>
<div class="b"><div class="bar" style="width:var(--space-8);height:var(--space-8)"></div><span class="v">32</span></div>
<div class="b"><div class="bar" style="width:var(--space-10);height:var(--space-10)"></div><span class="v">40</span></div>
<div class="b"><div class="bar" style="width:var(--space-11);height:var(--space-11)"></div><span class="v">44</span></div>
<div class="b"><div class="bar" style="width:var(--space-12);height:var(--space-12)"></div><span class="v">48</span></div>
<div class="b"><div class="bar" style="width:var(--space-14);height:var(--space-14)"></div><span class="v">56</span></div>
<div class="b"><div class="bar" style="width:var(--space-16);height:var(--space-16)"></div><span class="v">64</span></div>
</div>
</body></html>
