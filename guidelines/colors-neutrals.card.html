<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals & ink" subtitle="Toned off-whites and near-black — never pure #000/#fff" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:20px;display:flex;gap:14px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{width:120px;height:60px;border-radius:var(--radius-md);border:1px solid var(--border-1)}
.n{font-size:12px;color:var(--fg-1);font-weight:600}.v{font-size:11px;color:var(--fg-2);font-family:ui-monospace,monospace}</style>
</head><body>
<div class="sw"><div class="chip" style="background:var(--fg-1)"></div><span class="n">fg-1</span><span class="v">#1b1d1a</span></div>
<div class="sw"><div class="chip" style="background:var(--fg-2)"></div><span class="n">fg-2</span><span class="v">#63655f</span></div>
<div class="sw"><div class="chip" style="background:var(--surface-page)"></div><span class="n">surface-page</span><span class="v">#f5f6f8</span></div>
<div class="sw"><div class="chip" style="background:var(--surface-card)"></div><span class="n">surface-card</span><span class="v">#fdfdfc</span></div>
<div class="sw"><div class="chip" style="background:#fff;border-color:var(--fg-1)"><div style="height:100%;border-radius:inherit;border:1px solid var(--border-1)"></div></div><span class="n">border-1</span><span class="v">rgba(20,22,18,.10)</span></div>
</body></html>
