<!-- @dsCard group="Brand" viewport="700x170" name="Radius & elevation" subtitle="7/8/12/14/pill radii · soft ambient shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.b{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:74px;height:56px;background:var(--surface-card);border:1px solid var(--border-1)}
.v{font-size:11px;color:var(--fg-2);font-family:ui-monospace,monospace}</style>
</head><body>
<div class="b"><div class="box" style="border-radius:var(--radius-md)"></div><span class="v">md 8</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="v">lg 12</span></div>
<div class="b"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="v">xl 14</span></div>
<div class="b"><div class="box" style="border:none;border-radius:var(--radius-lg);box-shadow:var(--shadow-sm)"></div><span class="v">shadow-sm</span></div>
<div class="b"><div class="box" style="border:none;border-radius:var(--radius-lg);box-shadow:var(--shadow-md)"></div><span class="v">shadow-md</span></div>
<div class="b"><div class="box" style="border:none;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg)"></div><span class="v">shadow-lg</span></div>
</body></html>
