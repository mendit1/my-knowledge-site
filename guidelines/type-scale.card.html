<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-card);padding:20px 24px;color:var(--fg-1)}
.r{display:flex;align-items:baseline;gap:14px;padding:3px 0}
.t{font-family:ui-monospace,monospace;font-size:11px;color:var(--fg-2);width:120px;flex:none}
.s{font-family:var(--font-display);font-weight:var(--fw-semibold);line-height:1.05}</style>
</head><body>
<div class="r"><span class="t">display 50</span><span class="s" style="font-size:var(--text-display)">Aa</span></div>
<div class="r"><span class="t">h1 46</span><span class="s" style="font-size:var(--text-h1)">Retirement clarity</span></div>
<div class="r"><span class="t">h2 30</span><span class="s" style="font-size:var(--text-h2)">Section heading</span></div>
<div class="r"><span class="t">price 40 · stat 26</span><span class="s" style="font-size:var(--text-price)">$899</span></div>
<div class="r"><span class="t">h4 18</span><span class="s" style="font-size:var(--text-h4)">Card title</span></div>
<div class="r"><span class="t">lead 16 / body 15 / sm 14</span><span style="font-family:var(--font-body);font-size:var(--text-body)">Body copy in Inter, 15px.</span></div>
<div class="r"><span class="t">caption 12</span><span style="font-family:var(--font-body);font-size:var(--text-caption);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--accent);font-weight:600">Eyebrow</span></div>
</body></html>
