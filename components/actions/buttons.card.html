<!-- @dsCard group="Components" viewport="700x150" name="Button" subtitle="primary · outline · ghost · on-accent, md & sm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:22px;display:flex;flex-direction:column;gap:16px}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .band{background:var(--accent);border-radius:var(--radius-lg);padding:16px;display:flex;gap:14px}
  .btn{display:inline-flex;align-items:center;gap:var(--space-2);font-family:var(--font-body);font-size:var(--text-sm);font-weight:var(--fw-medium);padding:11px 20px;border-radius:var(--radius-md);border:1px solid transparent;cursor:pointer;text-decoration:none}
  .primary{background:var(--accent);color:var(--fg-on-accent)}
  .outline{border-color:var(--accent);color:var(--accent);background:transparent}
  .ghost{color:var(--fg-2);background:transparent}
  .sm{padding:9px 16px}
  .on-accent{background:var(--fg-on-accent);color:var(--accent)}
</style></head><body>
  <div class="row">
    <a class="btn primary">Book a free intro call</a>
    <a class="btn outline">Book a call</a>
    <a class="btn ghost">WeChat →</a>
    <a class="btn primary sm">Small</a>
    <a class="btn outline sm">Small</a>
  </div>
  <div class="band">
    <a class="btn on-accent">Pick a time on Calendly →</a>
    <a class="btn" style="border-color:rgba(255,255,255,.5);color:#fff">Message on WeChat</a>
  </div>
</body></html>
