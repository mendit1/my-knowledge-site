<!-- @dsCard group="Colors" viewport="700x230" name="Accent palettes" subtitle="Five low-chroma themes — base / strong / soft. Navy is default." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--surface-page);padding:18px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.lab{width:74px;font-size:12px;font-weight:600;color:var(--fg-1)}
.chip{width:96px;height:34px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:ui-monospace,monospace;color:#fff}
.chip.soft{color:var(--fg-1);border:1px solid var(--border-1)}
.tag{font-size:10px;color:var(--fg-2);width:56px}</style>
</head><body>
<div class="row"><span class="tag"></span><span class="tag" style="width:96px;text-align:center">base</span><span class="tag" style="width:96px;text-align:center">strong</span><span class="tag" style="width:96px;text-align:center">soft</span></div>
<div class="row"><span class="lab">Navy ★</span><div class="chip" style="background:var(--navy)">navy</div><div class="chip" style="background:var(--navy-strong)"></div><div class="chip soft" style="background:var(--navy-soft)"></div></div>
<div class="row"><span class="lab">Forest</span><div class="chip" style="background:var(--forest)">forest</div><div class="chip" style="background:var(--forest-strong)"></div><div class="chip soft" style="background:var(--forest-soft)"></div></div>
<div class="row"><span class="lab">Teal</span><div class="chip" style="background:var(--teal)">teal</div><div class="chip" style="background:var(--teal-strong)"></div><div class="chip soft" style="background:var(--teal-soft)"></div></div>
<div class="row"><span class="lab">Graphite</span><div class="chip" style="background:var(--graphite)">graphite</div><div class="chip" style="background:var(--graphite-strong)"></div><div class="chip soft" style="background:var(--graphite-soft)"></div></div>
<div class="row"><span class="lab">Bordeaux</span><div class="chip" style="background:var(--bordeaux)">bordeaux</div><div class="chip" style="background:var(--bordeaux-strong)"></div><div class="chip soft" style="background:var(--bordeaux-soft)"></div></div>
</body></html>
